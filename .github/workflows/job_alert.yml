name: Frontend Job Alert 🇵🇹

on:
  schedule:
    # 07:00 UTC
    # = 08:00 Lisbon during summer (WEST)
    # = 07:00 Lisbon during winter (WET)
    - cron: "0 7 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  job-alert:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout repository
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Set up Python
      # ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ─────────────────────────────────────────────
      # 3. Run job alert
      # ─────────────────────────────────────────────
      - name: Run job alert
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FINDWORK_KEY: ${{ secrets.FINDWORK_KEY }}
        run: |
          python job_alert.py