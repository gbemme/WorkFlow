name: Frontend Job Alert 🇵🇹

on:
  schedule:
    - cron: "0 7 * * 1-5"

  workflow_dispatch:

# 1. Add write permissions so the GITHUB_TOKEN can commit and push updates
permissions:
  contents: write

jobs:
  job-alert:
    runs-on: ubuntu-latest

    steps:

      # 2. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Run job alert script
      - name: Run job alert
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FINDWORK_KEY: ${{ secrets.FINDWORK_KEY }}
        run: |
          python job_alert.py

      # 5. Commit and push changes to seen_jobs.json
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen_jobs.json [skip ci]" && git push)